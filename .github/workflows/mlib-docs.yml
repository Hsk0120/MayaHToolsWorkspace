name: Publish mlib documentation

on:
  push:
    branches: [main]
    paths:
      - 'maya/inhouse/mlib/**'
      - 'maya/inhouse/MayaCodeEditor/docs/**'
      - 'maya/inhouse/mlrig/docs/**'
      - 'maya/inhouse/FramePlayer/docs/**'
      - 'maya/inhouse/HTools/_docs/**'
      - 'maya/inhouse/FramePlayer/src/app/FramePlayer.rc'
      - '.github/workflows/mlib-docs.yml'
      - 'tools/check_mlib_docs.py'
      - 'tools/check_mlib_exports.py'
      - 'tools/check_mlib_doc_getter_names.py'
      - 'tools/test_mlib_doc_getter_names.py'
      - 'tools/test_mlib_constructor_signatures.py'
      - 'tools/docs-browser-requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlib-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: maya/inhouse/mlib/_docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r maya/inhouse/mlib/_docs/requirements.txt
      - name: Check explicit mlib exports
        run: python tools/check_mlib_exports.py
      - name: Check getter and predicate documentation rules
        run: python tools/test_mlib_doc_getter_names.py
      - name: Check inherited node constructor signatures
        run: python tools/test_mlib_constructor_signatures.py
      - name: Build Sphinx documentation
        run: |
          python -m sphinx -E -a -b html -W --keep-going maya/inhouse/mlib/_docs/source maya/inhouse/mlib/_docs/_build/html
      - name: Check pinned Mermaid in built HTML
        run: python tools/check_mlib_docs.py --check-directory maya/inhouse/mlib/_docs/_build/html
      - name: Check preferred getter and predicate names and reference links
        run: |
          python tools/check_mlib_doc_getter_names.py maya/inhouse/mlib/_docs/_build/html
      - name: Stamp build revision
        run: python tools/check_mlib_docs.py --stamp-directory maya/inhouse/mlib/_docs/_build/html --sha "$GITHUB_SHA"
      - name: Install browser tests
        run: |
          python -m pip install -r tools/docs-browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify browser navigation before publication
        run: python tools/check_mlib_docs.py --directory maya/inhouse/mlib/_docs/_build/html --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-browser-before-deploy
          path: .maya-output/docs-browser/
          if-no-files-found: ignore
      - name: Build Maya Code Editor documentation into the published site
        run: |
          python -m pip install -r maya/inhouse/MayaCodeEditor/docs/requirements.txt
          python -m sphinx -E -a -b html -W --keep-going maya/inhouse/MayaCodeEditor/docs maya/inhouse/mlib/_docs/_build/html/maya-code-editor
          # 英語版(locale/en の .po の英訳。英訳は手元で tools/translate_docs.py が作る)。
          python -m sphinx -E -a -b html -W --keep-going -D language=en maya/inhouse/MayaCodeEditor/docs maya/inhouse/mlib/_docs/_build/html/maya-code-editor/en
      - name: Build mlrig documentation into the published site
        run: |
          python -m pip install -r maya/inhouse/mlrig/docs/requirements.txt
          python -m sphinx -E -a -b html -W --keep-going maya/inhouse/mlrig/docs maya/inhouse/mlib/_docs/_build/html/mlrig
          python -m sphinx -E -a -b html -W --keep-going -D language=en maya/inhouse/mlrig/docs maya/inhouse/mlib/_docs/_build/html/mlrig/en
      - name: Build FramePlayer documentation into the published site
        run: |
          python -m pip install -r maya/inhouse/FramePlayer/docs/requirements.txt
          python -m sphinx -E -a -b html -W --keep-going maya/inhouse/FramePlayer/docs maya/inhouse/mlib/_docs/_build/html/frameplayer
          # 英語版(locale/en の .po の英訳。英訳は手元で tools/translate_docs.py が作る)。
          python -m sphinx -E -a -b html -W --keep-going -D language=en maya/inhouse/FramePlayer/docs maya/inhouse/mlib/_docs/_build/html/frameplayer/en
      - name: Build HTools documentation into the published site
        run: |
          python -m pip install -r maya/inhouse/HTools/_docs/requirements.txt
          python -m sphinx -E -a -b html -W --keep-going maya/inhouse/HTools/_docs maya/inhouse/mlib/_docs/_build/html/htools
      - uses: actions/upload-pages-artifact@v3
        with:
          path: maya/inhouse/mlib/_docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-publication:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tests
        run: |
          python -m pip install -r tools/docs-browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify published revision and browser navigation
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: python tools/check_mlib_docs.py --url "$PAGES_URL" --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-browser-published
          path: .maya-output/docs-browser/
          if-no-files-found: ignore
