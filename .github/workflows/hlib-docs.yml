name: Publish hlib documentation

on:
  push:
    branches: [main]
    paths:
      - 'maya/inhouse/hlib/**'
      - '.github/workflows/hlib-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hlib-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: maya/inhouse/hlib/docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r maya/inhouse/hlib/docs/requirements.txt
      - name: Build Sphinx documentation
        run: python -m sphinx -E -a -b html -W --keep-going maya/inhouse/hlib/docs maya/inhouse/hlib/docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: maya/inhouse/hlib/docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
