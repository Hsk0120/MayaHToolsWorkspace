name: Publish hlib documentation

on:
  push:
    branches: [main]
    paths:
      - 'maya/inhouse/hlib/**'
      - '.github/workflows/hlib-docs.yml'
      - 'tools/check_hlib_docs.py'
      - 'tools/docs-browser-requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hlib-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: maya/inhouse/hlib/docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r maya/inhouse/hlib/docs/requirements.txt
      - name: Build Sphinx documentation
        run: python -m sphinx -E -a -b html -W --keep-going maya/inhouse/hlib/docs maya/inhouse/hlib/docs/_build/html
      - name: Check pinned Mermaid in built HTML
        run: python tools/check_hlib_docs.py --check-directory maya/inhouse/hlib/docs/_build/html
      - name: Stamp build revision
        run: python tools/check_hlib_docs.py --stamp-directory maya/inhouse/hlib/docs/_build/html --sha "$GITHUB_SHA"
      - name: Install browser tests
        run: |
          python -m pip install -r tools/docs-browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify browser navigation before publication
        run: python tools/check_hlib_docs.py --directory maya/inhouse/hlib/docs/_build/html --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-browser-before-deploy
          path: .maya-output/docs-browser/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: maya/inhouse/hlib/docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-publication:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tests
        run: |
          python -m pip install -r tools/docs-browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify published revision and browser navigation
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: python tools/check_hlib_docs.py --url "$PAGES_URL" --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-browser-published
          path: .maya-output/docs-browser/
          if-no-files-found: ignore
