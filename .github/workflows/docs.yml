name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - 'maya/inhouse/MayaCodeEditor/docs/**'
      - 'maya/inhouse/QuickPathExplorer/docs/**'
      - 'maya/inhouse/QuickPathExplorer/src/product.h'
      - 'maya/inhouse/QuickPathExplorer/icons/quickPathExplorer.svg'
      - 'maya/inhouse/mlrig/docs/**'
      - 'maya/inhouse/FramePlayer/docs/**'
      - 'maya/inhouse/HTools/_docs/**'
      - 'maya/inhouse/FramePlayer/src/app/FramePlayer.rc'
      - '.github/workflows/docs.yml'
      - '.github/pages/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start the site with the landing page
        run: |
          mkdir -p _site
          cp .github/pages/index.html _site/index.html
      - name: Build Maya Code Editor documentation into the published site
        run: |
          python -m pip install -r maya/inhouse/MayaCodeEditor/docs/requirements.txt
          python -m sphinx -E -a -b html -W --keep-going maya/inhouse/MayaCodeEditor/docs _site/maya-code-editor
          # 英語版(locale/en の .po の英訳。英訳は手元で tools/translate_docs.py が作る)。
          python -m sphinx -E -a -b html -W --keep-going -D language=en maya/inhouse/MayaCodeEditor/docs _site/maya-code-editor/en
      - name: Build QuickPathExplorer documentation into the published site
        run: |
          python -m pip install -r maya/inhouse/QuickPathExplorer/docs/requirements.txt
          python -m sphinx -E -a -b html -W --keep-going maya/inhouse/QuickPathExplorer/docs _site/quick-path-explorer
          python -m pip install -r maya/inhouse/QuickPathExplorer/docs/browser-requirements.txt
          python -m playwright install --with-deps chromium
          python maya/inhouse/QuickPathExplorer/docs/tools/check_docs.py --directory _site/quick-path-explorer --sha "$GITHUB_SHA" --output .maya-output/qpe-docs-before-deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qpe-docs-browser-before-deploy
          path: .maya-output/qpe-docs-before-deploy/
          if-no-files-found: ignore
      - name: Build mlrig documentation into the published site
        run: |
          python -m pip install -r maya/inhouse/mlrig/docs/requirements.txt
          python -m sphinx -E -a -b html -W --keep-going maya/inhouse/mlrig/docs _site/mlrig
          python -m sphinx -E -a -b html -W --keep-going -D language=en maya/inhouse/mlrig/docs _site/mlrig/en
      - name: Build FramePlayer documentation into the published site
        run: |
          python -m pip install -r maya/inhouse/FramePlayer/docs/requirements.txt
          python -m sphinx -E -a -b html -W --keep-going maya/inhouse/FramePlayer/docs _site/frameplayer
          # 英語版(locale/en の .po の英訳。英訳は手元で tools/translate_docs.py が作る)。
          python -m sphinx -E -a -b html -W --keep-going -D language=en maya/inhouse/FramePlayer/docs _site/frameplayer/en
      - name: Build HTools documentation into the published site
        run: |
          python -m pip install -r maya/inhouse/HTools/_docs/requirements.txt
          python -m sphinx -E -a -b html -W --keep-going maya/inhouse/HTools/_docs _site/htools
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-publication:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify published QuickPathExplorer guide
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          python -m pip install -r maya/inhouse/QuickPathExplorer/docs/browser-requirements.txt
          python -m playwright install --with-deps chromium
          python maya/inhouse/QuickPathExplorer/docs/tools/check_docs.py --url "${PAGES_URL%/}/quick-path-explorer/" --sha "$GITHUB_SHA" --output .maya-output/qpe-docs-published
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qpe-docs-browser-published
          path: .maya-output/qpe-docs-published/
          if-no-files-found: ignore
