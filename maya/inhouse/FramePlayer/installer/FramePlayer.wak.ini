; FramePlayer のインストーラーの設定(tools/WinAppKit の WinAppSetup で読む)。
; セットアップの作り方は README の「インストーラー」を参照。パスはこのファイルのフォルダからの相対パス。

[App]
Id=FramePlayer
Name=FramePlayer
; バージョンは書かない(FramePlayer.exe のバージョン情報 = src/app/FramePlayer.rc から読む)。
Publisher=Hsk0120
Description=Video player for frame-by-frame review and side-by-side comparison
Executable=FramePlayer.exe
InstallDir={LocalPrograms}\FramePlayer
StartMenuShortcut=yes
SetupIcon=../resources/icon/FramePlayer.ico

[Files]
../FramePlayer.exe=FramePlayer.exe
../README.md=README.md

[FileTypes]
; 右クリックの「FramePlayerで開く」、「プログラムから開く」、設定の「既定のアプリ」の候補に出す。
ProgId=FramePlayer.Video
Description=Video or image sequence (FramePlayer)
Extensions=.mp4;.mov;.m4v;.avi;.wmv;.mkv;.webm;.mts;.m2ts;.ts;.mpg;.mpeg;.vob;.3gp;.png;.jpg;.jpeg;.tif;.tiff;.bmp;.gif;.webp;.heic;.heif;.hif;.avif;.jxl;.jxr;.wdp;.exr
ContextMenu=Open with FramePlayer
Optional=yes
; 開くのにWindowsの拡張機能(Microsoft Store)が要る形式。入っていないPCでは関連付けない(画面では灰色で選べない)。
; wic = その拡張子を読める画像コーデックがある、mfvideo:XXXX = その形式の動画デコーダーがある。
Require.webm=mfvideo:VP90|mfvideo:AV01
RequireNote.webm=VP9 Video Extensions (or AV1 Video Extension)
Require.webp=wic
RequireNote.webp=Webp Image Extensions
Require.heic=wic+mfvideo:HEVC
RequireNote.heic=HEIF Image Extensions and HEVC Video Extensions
Require.heif=wic+mfvideo:HEVC
RequireNote.heif=HEIF Image Extensions and HEVC Video Extensions
Require.hif=wic+mfvideo:HEVC
RequireNote.hif=HEIF Image Extensions and HEVC Video Extensions
Require.avif=wic+mfvideo:AV01
RequireNote.avif=AV1 Video Extension (and HEIF Image Extensions)
Require.jxl=wic
RequireNote.jxl=JPEG XL Image Extension

[UserData]
; アンインストールで「設定などのデータも削除する」を選んだときだけ消す(音量・最近使ったファイル・連携の鍵)。
Registry=HKCU\Software\FramePlayer
Folder={LocalAppData}\FramePlayer
