<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
  <title id="title">QuickPathExplorerの画面構成（模式図）</title>
  <desc id="desc">上部にタブとパス、中央上段にフォルダーカラム、下段にファイル一覧。左は場所、右は詳細とMaya操作のサイドバー。</desc>
  <defs>
    <g id="folder"><path d="M0 2h7l3 3h12v13H0z" fill="#f4c758"/></g>
  </defs>
  <rect width="960" height="490" rx="10" fill="#191919"/>
  <g font-family="Segoe UI, Yu Gothic, sans-serif" font-size="16" fill="#e1e4e5">
    <rect x="12" y="12" width="225" height="38" rx="6" fill="#343a3b"/>
    <use href="#folder" x="25" y="21"/><text x="60" y="37">scenes</text><text x="255" y="37">＋</text>
    <text x="22" y="80" fill="#7edce3">←　→</text><rect x="103" y="60" width="662" height="32" rx="5" fill="#2b2b2b"/>
    <text x="116" y="82">D:\Projects\ProjectA\scenes</text><text x="786" y="82">Aa　ツール</text>
    <rect x="12" y="108" width="145" height="354" fill="#222222"/>
    <text x="27" y="140" fill="#7edce3">場所</text><text x="27" y="177">お気に入り</text><text x="27" y="214">最近使った項目</text><text x="27" y="251">デスクトップ</text><text x="27" y="288">ドキュメント</text><text x="27" y="337">ドライブ</text>
    <path d="M170 108v180M355 108v180M540 108v180M749 108v354" stroke="#555555"/>
    <use href="#folder" x="185" y="126"/><text x="215" y="142">Projects</text><text x="331" y="142">›</text>
    <rect x="365" y="120" width="164" height="32" rx="3" fill="#3e494b"/>
    <use href="#folder" x="376" y="126"/><text x="406" y="142">ProjectA</text><text x="510" y="142">›</text>
    <rect x="551" y="120" width="184" height="32" rx="3" fill="#225860"/>
    <use href="#folder" x="561" y="126"/><text x="591" y="142">scenes</text><text x="712" y="142">›</text>
    <use href="#folder" x="561" y="169"/><text x="591" y="185">sourceimages</text>
    <text x="188" y="258" fill="#7edce3">上段：フォルダーカラム</text>
    <path d="M170 289h567" stroke="#555555"/><text x="184" y="318" fill="#a6afb2">名前</text><text x="599" y="318" fill="#a6afb2">サイズ</text>
    <rect x="178" y="332" width="559" height="32" fill="#303638"/>
    <text x="190" y="354">character.mb</text><text x="599" y="354">2.4 MiB</text><text x="190" y="393">animation.fbx</text><text x="599" y="393">860 KiB</text>
    <text x="188" y="441" fill="#7edce3">下段：ファイル一覧</text>
    <rect x="761" y="108" width="187" height="354" fill="#222222"/>
    <text x="778" y="140" fill="#7edce3">右サイドバー</text><text x="778" y="177">ファイル情報</text><text x="778" y="214">プレビュー</text><path d="M778 237h150" stroke="#555555"/>
    <text x="778" y="272">Mayaの操作</text><text x="778" y="309">開く / 読み込み</text><text x="778" y="346">リファレンス</text><text x="778" y="383">名前空間 / FBX</text>
    <text x="22" y="482" fill="#a6afb2" font-size="13">画面構成の説明図です。サイドバーは必要に応じて表示します。</text>
